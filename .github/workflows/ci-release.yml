name: CI / Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mise en cache des dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format (cargo fmt --check)
        run: cargo fmt --check

      - name: Vérification (cargo check)
        run: cargo check

      - name: Tests unitaires (cargo test)
        run: cargo test

  e2e-tests:
    needs: ci
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mise en cache des dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances Python (pytest)
        run: pip install -r e2e/requirements.txt

      - name: Compilation Release
        run: cargo build --release

      - name: Tests E2E (pytest)
        run: pytest e2e/ -v

  release:
    needs: [ci, e2e-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mise en cache des dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Compilation Release
        run: cargo build --release

      - name: Renommage du binaire pour Windows
        run: |
          if (Test-Path "target/release/proton-bridge.exe") {
            Rename-Item "target/release/proton-bridge.exe" "proton-bridge.exe"
          }

      - name: Création de la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: proton-bridge.exe
          generate_release_notes: true
          draft: false
          prerelease: false
