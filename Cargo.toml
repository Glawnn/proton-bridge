[package]
name = "proton-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "cookies", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
semver = "1.0"

[package.metadata]
